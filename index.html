<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCT · Estado de Equipos</title>
<style>
  :root{
    --c-avail:#1ea4d9; --c-run:#3bc92b; --c-em:#f5c12e; --c-pm:#b04cc8;
    --c-dmg:#d42a2a;   --c-oos:#6d6d6d;
    --bg:#eef1f5; --card:#ffffff; --ink:#1d2430; --mute:#8a93a3;
    --red-bg:#fde6e6; --yel-bg:#fdf5dc; --grn-bg:#e3f4e5;
    --red-tx:#d23131; --yel-tx:#d99a00; --grn-tx:#23a043;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
       font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft JhengHei",sans-serif;
       display:flex;flex-direction:column}

  /* ── 頂列 ── */
  header{display:flex;align-items:center;gap:1.6vw;padding:.9vh 1.4vw;height:7vh}
  header h1{font-size:2.1vw;font-weight:800;letter-spacing:.02em}
  .clock{font-size:1.9vw;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
  .upd{font-size:.95vw;color:var(--mute);text-align:right;line-height:1.3}
  .upd.err{color:var(--red-tx);font-weight:700}
  .lang{display:flex;gap:.3vw}
  .lang button{border:1px solid #c9d0db;background:#fff;color:var(--mute);border-radius:6px;
               font-size:.8vw;padding:.2vw .5vw;cursor:pointer}
  .lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ── 10 張字卡：上 5、下 5 ── */
  main{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
       gap:1vw;padding:0 1.4vw 1.4vw}
  .card{min-width:0;border-radius:14px;padding:1.1vh 1vw 1.2vh;display:flex;flex-direction:column;
        background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.07);border:2px solid transparent;
        transition:background .4s}
  .card.red{background:var(--red-bg);border-color:#f3c2c2}
  .card.yel{background:var(--yel-bg);border-color:#efdca0}
  .card.grn{background:var(--grn-bg);border-color:#b9e2c1}

  .top{display:flex;align-items:baseline;justify-content:space-between;gap:.5vw;min-width:0}
  .name{font-size:1.9vw;font-weight:800;white-space:nowrap}
  .tt{text-align:right;font-size:.85vw;color:var(--mute);line-height:1.25;white-space:nowrap}
  .tt b{font-size:1.25vw;color:var(--ink)}

  .grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;
        gap:.5vw;margin:1vh 0}
  .st{display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:rgba(255,255,255,.65);border-radius:10px;padding:.4vh .2vw}
  .pill{color:#fff;font-weight:800;border-radius:6px;font-size:.62vw;line-height:1.15;
        padding:.25vh .35vw;text-align:center;text-transform:uppercase;min-height:3.2vh;
        display:flex;align-items:center;justify-content:center;width:100%}
  .pill.em{color:#3a2b00}
  .num{font-size:3vw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:.3vh}
  .num.zero{color:#b8bec9 !important;font-weight:500}
  .flash{animation:flash 1.2s ease-out 2}
  @keyframes flash{0%{transform:scale(1.35);text-shadow:0 0 12px currentColor}100%{transform:scale(1)}}

  /* ── VS TARGET ── */
  .vs{font-size:.7vw;color:var(--mute);font-weight:700;letter-spacing:.05em}
  .bar{position:relative;height:1.2vh;border-radius:99px;margin:1.3vh 0 .5vh;overflow:visible}
  .bar .mk{position:absolute;top:-1.25vh;width:0;height:0;transform:translateX(-50%);
           border-left:.45vw solid transparent;border-right:.45vw solid transparent;
           border-top:1vh solid currentColor;transition:left .6s}
  .ratio{text-align:center;font-size:1.35vw;font-weight:800;font-variant-numeric:tabular-nums}
  .red .ratio,.red .mk{color:var(--red-tx)}
  .yel .ratio,.yel .mk{color:var(--yel-tx)}
  .grn .ratio,.grn .mk{color:var(--grn-tx)}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="lang">
    <button data-l="es">ES</button><button data-l="zh">中</button><button data-l="en">EN</button>
  </div>
  <div class="clock" id="clock"></div>
  <div class="upd" id="upd"></div>
</header>
<main id="board"></main>

<script>
// ============================================================
// 設定區
// ============================================================
const GAS_URL  = 'https://script.google.com/macros/s/AKfycbxabR1SBUjABw7bPRBLJ0_OUMTfjBLPoLjHfl9wCTY3IGli3OOdpnv-yqjsykJ11HG2/exec';
const POLL_MS  = 5000;   // 每 5 秒更新

// 10 張字卡：名稱、包含的類別、固定 Total、Target（照 Makara 表）
const GROUPS = [
  { name:'TR',        cats:['TR'],         total:90,  target:81 },
  { name:'RTG',       cats:['RTG'],        total:38,  target:33 },
  { name:'FL',        cats:['FL'],         total:13,  target:11 },
  { name:'PPG',       cats:['PPG'],        total:9,   target:8  },
  { name:'S/P & SSH', cats:['SP'],         total:30,  target:28 },
  { name:'ARMGC',     cats:['ARMGC'],      total:4,   target:3  },
  { name:'CH',        cats:['CH'],         total:110, target:81 },
  { name:'GC',        cats:['GC'],         total:13,  target:12 },
  { name:'R/S',       cats:['RS'],         total:5,   target:2  },
  { name:'SL & ESL',  cats:['SL','ESL'],   total:13,  target:9  }
];

// 6 種狀態（Planned Disposal 等其他狀態不顯示）
const STATES = [
  { key:'Available',             cls:'avail', color:'var(--c-avail)' },
  { key:'Running',               cls:'run',   color:'var(--c-run)'   },
  { key:'Emergency Maintenance', cls:'em',    color:'var(--c-em)'    },
  { key:'Planned Maintenance',   cls:'pm',    color:'var(--c-pm)'    },
  { key:'Damaged',               cls:'dmg',   color:'var(--c-dmg)'   },
  { key:'Out Of Service',        cls:'oos',   color:'var(--c-oos)'   }
];

// ============================================================
// 三語
// ============================================================
const I18N = {
  es:{ title:'CCT · Estado de Equipos', total:'Total', target:'Meta', vs:'VS META',
       upd:'Actualizado', err:'Sin conexión · último dato', wait:'Cargando…',
       st:{ 'Available':'Disponible','Running':'En operación','Emergency Maintenance':'Mant. de emergencia',
            'Planned Maintenance':'Mant. planificado','Damaged':'Dañado','Out Of Service':'Fuera de servicio' } },
  zh:{ title:'CCT · 車機狀態', total:'總數', target:'目標', vs:'對比目標',
       upd:'更新於', err:'連線中斷 · 最後資料', wait:'載入中…',
       st:{ 'Available':'可用','Running':'運轉中','Emergency Maintenance':'緊急維修',
            'Planned Maintenance':'計畫保養','Damaged':'損壞','Out Of Service':'停用' } },
  en:{ title:'CCT · Equipment Status', total:'Total', target:'Target', vs:'VS TARGET',
       upd:'Updated', err:'Offline · last data', wait:'Loading…',
       st:{ 'Available':'Available','Running':'Running','Emergency Maintenance':'Emergency Maintenance',
            'Planned Maintenance':'Planned Maintenance','Damaged':'Damaged','Out Of Service':'Out of Service' } }
};

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
let lang = new URLSearchParams(location.search).get('lang') || store('mb_lang') || 'es';
if (!I18N[lang]) lang = 'es';

// ============================================================
// 畫面
// ============================================================
const board = document.getElementById('board');
let lastCounts = null;   // 上一次各卡各狀態數字（用來判斷閃爍）
let lastOk = null;       // 最後一次成功取得資料的時間
let failed = false;

function buildCards(){
  const T = I18N[lang];
  document.getElementById('title').textContent = T.title;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));

  board.innerHTML = GROUPS.map((g, i) => `
    <section class="card" id="card${i}">
      <div class="top">
        <div class="name">${g.name}</div>
        <div class="tt">${T.total} <b>${g.total}</b> &nbsp; ${T.target} <b>${g.target}</b></div>
      </div>
      <div class="grid">
        ${STATES.map(s => `
          <div class="st">
            <div class="pill ${s.cls}" style="background:${s.color}">${T.st[s.key]}</div>
            <div class="num zero" id="n${i}_${s.cls}" style="color:${s.color}">–</div>
          </div>`).join('')}
      </div>
      <div class="vs">${T.vs}</div>
      <div class="bar" id="bar${i}"><div class="mk" id="mk${i}"></div></div>
      <div class="ratio" id="r${i}">– / ${g.target}</div>
    </section>`).join('');

  // 進度條底色：0 → Target 紅到黃漸層，Target → Total 綠色
  GROUPS.forEach((g, i) => {
    const t = Math.min(100, g.target / g.total * 100);
    document.getElementById('bar' + i).style.background =
      `linear-gradient(90deg,#e03a2f 0%,#ef8a1f ${t*0.6}%,#f2b51d ${t}%,#2ea84a ${t}%,#2ea84a 100%)`;
  });

  if (lastCounts) render(lastCounts, true);
  showUpd();
}

function countsFrom(data){
  const cats = (data && data.categories) || {};
  return GROUPS.map(g => {
    const c = {};
    STATES.forEach(s => {
      c[s.cls] = g.cats.reduce((sum, k) => sum + ((cats[k] && cats[k].counts && cats[k].counts[s.key]) || 0), 0);
    });
    return c;
  });
}

function render(counts, noFlash){
  counts.forEach((c, i) => {
    const g = GROUPS[i];
    STATES.forEach(s => {
      const el = document.getElementById(`n${i}_${s.cls}`);
      const v  = c[s.cls];
      if (!noFlash && lastCounts && lastCounts[i][s.cls] !== v) {
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      }
      el.textContent = v;
      el.classList.toggle('zero', v === 0);
    });

    const ok   = c.avail + c.run;
    const rate = ok / g.target;
    const card = document.getElementById('card' + i);
    card.classList.remove('red','yel','grn');
    card.classList.add(rate >= 1 ? 'grn' : 'red');
    document.getElementById('mk' + i).style.left = Math.min(100, ok / g.total * 100) + '%';
    document.getElementById('r' + i).textContent = `${ok} / ${g.target}`;
  });
}

function showUpd(){
  const T  = I18N[lang];
  const el = document.getElementById('upd');
  if (!lastOk) { el.textContent = failed ? T.err : T.wait; el.classList.toggle('err', failed); return; }
  const t = lastOk.toLocaleTimeString('es-PA', { hour12:false });
  el.innerHTML = failed ? `${T.err}<br>${t}` : `${T.upd}<br>${t}`;
  el.classList.toggle('err', failed);
}

// ============================================================
// 取資料（每 5 秒；上一次還沒回來就不重複發）
// ============================================================
let busy = false;
async function poll(){
  if (busy) return;
  busy = true;
  try {
    const res  = await fetch(GAS_URL, { cache:'no-store' });
    const data = await res.json();
    if (!data || !data.categories) throw new Error('bad data');
    const counts = countsFrom(data);
    render(counts, false);
    lastCounts = counts;
    lastOk = new Date();
    failed = false;
  } catch (e) {
    failed = true;
  } finally {
    busy = false;
    showUpd();
  }
}

function tick(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es-PA', { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l; store('mb_lang', lang); buildCards();
}));

buildCards();
tick(); setInterval(tick, 1000);
poll(); setInterval(poll, POLL_MS);
</script>
</body>
</html>
